# Zabbix UserParameters for weewx monitoring
# Installation: Copy to /etc/zabbix/zabbix_agentd.d/weewx.conf

# Website Health Check
# Returns: 0=healthy, 1=banner missing, 2=timestamp stale/missing, 3=unreachable
UserParameter=weewx.website.health,/etc/zabbix/scripts/weewx_website_health.sh

# Docker Container Status
# Usage: weewx.container.status[container_name]
# Returns: 1=running, 0=stopped/missing
UserParameter=weewx.container.status[*],docker ps --filter "name=$1" --format "{{.State}}" | grep -c "running"

# Data Freshness Check
# Returns: age in minutes of newest PNG file (999 if no files found)
UserParameter=weewx.data.freshness,/etc/zabbix/scripts/weewx_data_freshness.sh
